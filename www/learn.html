<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG COPTIC — مسار التعلم</title>
  <script>
    (function () {
      var token = localStorage.getItem('mg_coptic_student_auth_token');
      var user = localStorage.getItem('mg_coptic_user');
      var hasAuth = false;
      if (token && token.trim().length > 15) hasAuth = true;
      if (user && user.indexOf('"id"') !== -1) hasAuth = true;
      if (!hasAuth) {
        window.location.replace('welcome.html');
      } else {
        window.location.replace('index.html#learn' + (window.location.search || ''));
      }
    })();
  </script>
  <link rel="stylesheet" href="css/preloader.css">
</head>
<body style="background:#F8EFE0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:'Segoe UI',sans-serif;">
  <div style="text-align:center;padding:20px;">
    <div style="font-size:1.15rem;color:#6B1530;font-weight:bold;margin-bottom:8px;">جاري نقلك إلى مسار التعلم...</div>
    <div style="font-size:.9rem;color:#785F37;">منصة MG Coptic</div>
  </div>
</body>
</html>

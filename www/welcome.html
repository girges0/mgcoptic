<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MG COPTIC</title>
  <meta name="description" content="منصة MG COPTIC لتعلم اللغة القبطية">
  <meta name="theme-color" content="#F7EEDD">
  <link rel="manifest" href="manifest.json">
  <script src="js/pwa-register.js"></script>
  <script>
    try {
      const savedToken = localStorage.getItem('mg_coptic_student_auth_token');
      if (savedToken) {
        const parsed = JSON.parse(savedToken);
        if (parsed && (parsed.access_token || parsed.user)) {
          window.location.replace('index.html');
        }
      }
    } catch(e) {}
  </script>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/preloader.css">

  <style>
    :root {
      --bg-cream: #F8EFE0;
      --madder: #6B1530;
      --madder-dark: #4A0E21;
      --gold: #B8892E;
      --gold-border: #DBC8A4;
      --ink: #261912;
      --ink-subtle: #4A3A30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--ink);
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)) 24px;
    }

    /* الحاوية الرئيسية المتجاوبة بحجم شاشة الهاتف */
    .container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* الجزء الأوسط: الشعار والنصوص */
    .hero-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 20px;
    }

    .logo-img {
      width: 160px;
      max-width: 60vw;
      height: auto;
      object-fit: contain;
      display: block;
      margin-bottom: 18px;
    }

    .brand-title {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #241A15;
      margin-bottom: 8px;
      font-family: 'Cairo', sans-serif;
    }

    .brand-subtitle {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink-subtle);
      font-family: 'Tajawal', sans-serif;
    }

    /* قسم الأزرار في الأسفل بستايل دويلينجو */
    .buttons-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 18px 24px;
      border-radius: 9999px; /* شكل كبسولة بيضاوي ناعم */
      font-family: 'Cairo', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      display: block;
      cursor: pointer;
      border: none;
      transition: all 0.12s ease;
      outline: none;
    }

    /* الزر الأساسي: عنابي ملكي */
    .btn-primary {
      background-color: var(--madder);
      color: #FFFFFF;
      box-shadow: 0 4px 0 var(--madder-dark);
    }

    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--madder-dark);
    }

    /* الزر الثانوي: بيج فاتح بإطار ذهبي ناعم */
    .btn-secondary {
      background-color: #FAF4E9;
      color: var(--madder);
      border: 2px solid var(--gold-border);
      box-shadow: 0 4px 0 #CEBA93;
    }

    .btn-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #CEBA93;
    }


  </style>
</head>
<body>

  <!-- MG COPTIC Preloader -->
  <div id="mg-preloader" role="status" aria-label="جارٍ التحميل" style="background:#F8EFE0;">
    <div class="mg-preloader-content" id="mg-loader-main-box">
      <div class="mg-loader-logo-wrap">
        <img src="logo.png" alt="MG COPTIC">
      </div>
      <div class="mg-spinner-wrap">
        <div class="mg-spinner"></div>
      </div>
      <div class="mg-loading-text">MG COPTIC</div>
      <div class="mg-loading-subtext" id="mg-loader-subtext">جارٍ التحميل...</div>
      <div class="mg-slow-notice" id="mg-slow-notice" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>الاتصال ضعيف، جاري المتابعة...</span>
      </div>
    </div>
    <div class="mg-loader-error" id="mg-loader-error-box">
      <div class="error-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
      </div>
      <h3>الاتصال بالإنترنت ضعيف</h3>
      <p>يستغرق التحميل وقتاً أطول من المعتاد بسبب جودة الاتصال.</p>
      <button type="button" class="mg-btn-retry" onclick="window.MGPreloader && window.MGPreloader.retry()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        <span>إعادة المحاولة</span>
      </button>
    </div>
  </div>

  <div class="container">
    
    <!-- الشعار في المنتصف -->
    <div class="hero-section">
      <img src="logo.png" alt="MG COPTIC" class="logo-img">
      <h1 class="brand-title">MGCOPTIC</h1>
      <p class="brand-subtitle">ابدأ رحلتك في تعلّم اللغة القبطية</p>
    </div>

    <!-- الأزرار بستايل دويلينجو -->
    <div class="buttons-section">
      <a href="signup.html" class="btn btn-primary">ابدأ الآن</a>
      <a href="login.html" class="btn btn-secondary">لدي حساب بالفعل</a>
      <a href="index.html?guest=true" style="color:var(--ink-subtle);font-size:0.95rem;font-weight:700;text-decoration:none;margin-top:6px;text-align:center;display:block;">متابعة كزائر ←</a>
    </div>

  </div>

  <script src="js/preloader.js"></script>
</body>
</html>

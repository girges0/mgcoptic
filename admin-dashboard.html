<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG COPTIC — تحويل إلى لوحة التحكم</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  
  <script>
    const targetUrl = 'admin/index.html' + window.location.search + window.location.hash;
    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 300);
  </script>
  <meta http-equiv="refresh" content="1; url=admin/index.html">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #FBF8F1;
      color: #6B1530;
      text-align: center;
      direction: rtl;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 3.5px solid rgba(107, 21, 48, 0.12);
      border-top-color: #6B1530;
      border-right-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 1rem;
      font-weight: 700;
      color: #6B1530;
      margin-bottom: 8px;
    }
    a {
      font-size: 0.85rem;
      color: #7A695A;
      text-decoration: underline;
      transition: color 0.2s;
    }
    a:hover {
      color: #6B1530;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>جارٍ التحويل إلى لوحة التحكم...</p>
  <a href="admin/index.html">انقر هنا إذا لم يتم نقلك تلقائياً</a>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد – MG COPTIC</title>
  <meta name="description" content="إنشاء حساب جديد في منصة MG COPTIC لتعلم اللغة القبطية الكنسية.">
  <meta name="theme-color" content="#6B1530">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MG COPTIC">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="icon" type="image/png" href="assets/images/favicon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png?v=2">
  <link rel="apple-touch-icon" href="assets/images/favicon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=Noto+Sans+Coptic&display=swap"
    rel="stylesheet">

  <!-- Core Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="swal-theme.js"></script>

  <!-- Configuration & Auth Service -->
  <script src="js/config/supabase.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/services/device-tracker.js?v=1.0.0" defer></script>
  <script src="js/back-button-handler.js"></script>

  <style>
    @font-face {
      font-family: 'girges';
      src: url('girges.woff') format('woff'),
        url('assets/fonts/girges.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Coptic Girges';
      src: url('girges.woff') format('woff'),
        url('assets/fonts/girges.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --parchment: #F6F1E7;
      --parchment-soft: #FCFAF6;
      --border-light: #E7DCC8;
      --border-focus: #C4A052;
      --madder: #6B1530;
      --madder-hover: #540F24;
      --gold: #C4A052;
      --ink: #221814;
      --ink-soft: #6A5B50;
      --ink-muted: #8E7D70;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --font-display: 'Cairo', 'Tajawal', sans-serif;
      --font-body: 'Tajawal', 'Cairo', sans-serif;
      --shadow-ambient: 0 20px 48px -12px rgba(46, 32, 24, 0.14), 0 2px 8px rgba(46, 32, 24, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at 5% -5%, rgba(196, 160, 82, 0.16), transparent 60%),
        radial-gradient(900px 500px at 95% 10%, rgba(107, 21, 48, 0.09), transparent 55%),
        radial-gradient(800px 600px at 50% 100%, rgba(196, 160, 82, 0.10), transparent 70%),
        var(--parchment);
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      background: rgba(255, 254, 251, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(220, 206, 185, 0.75);
      border-radius: 22px;
      width: 100%;
      max-width: 450px;
      padding: 32px 26px 26px;
      box-shadow: 0 20px 48px -10px rgba(46, 32, 24, 0.12), 0 2px 8px rgba(46, 32, 24, 0.04);
      position: relative;
      margin: auto;
      animation: modalPop .28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .auth-logo-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1.5px solid rgba(196, 160, 82, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(107, 21, 48, 0.08);
      overflow: hidden;
      padding: 7px;
      box-sizing: border-box;
      transition: transform 0.2s ease;
    }

    .auth-logo-badge:hover {
      transform: scale(1.04);
    }

    .auth-logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-header h1 {
      margin: 2px 0 4px 0;
      font-family: var(--font-display);
      color: #221814;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .auth-header p {
      margin: 0;
      font-size: 0.92rem;
      color: #736458;
      font-weight: 500;
    }

    /* Google Button - Ultra Modern */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1.5px solid #DDD3C4;
      color: #2D2522;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.94rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-google:hover {
      background: #FAF8F5;
      border-color: #C4A052;
      box-shadow: 0 4px 14px rgba(107, 21, 48, 0.08);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0);
      background: #F3EFE9;
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 16px;
      color: #9C8D80;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(220, 206, 185, 0.8);
    }

    /* Segmented Tabs (Phone / Email) - Sleek & Compact */
    .auth-tabs-pill {
      display: flex;
      background: #EFE8DF;
      padding: 3px;
      border-radius: 10px;
      margin: 0 auto 16px;
      max-width: 320px;
      border: 1px solid rgba(215, 200, 180, 0.7);
      gap: 3px;
    }

    .auth-tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      color: #736458;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .auth-tab-btn:hover:not(.active):not(.tab-disabled) {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.5);
    }

    .auth-tab-btn svg {
      width: 15px;
      height: 15px;
      transition: stroke 0.2s ease;
    }

    .auth-tab-btn.active {
      background: #FFFFFF;
      color: var(--madder);
      box-shadow: 0 1px 4px rgba(40, 20, 10, 0.09), 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .auth-tab-btn.active svg {
      stroke: var(--madder);
    }

    .auth-tab-btn.tab-disabled {
      cursor: not-allowed;
      opacity: 0.7;
      background: rgba(0, 0, 0, 0.02);
      border: 1px dashed rgba(200, 185, 170, 0.7);
    }

    .auth-tab-btn.tab-disabled:hover {
      background: rgba(107, 21, 48, 0.03);
    }

    .tab-badge-unavailable {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 5px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 800;
      background: rgba(180, 83, 9, 0.1);
      color: #B45309;
      border: 1px solid rgba(180, 83, 9, 0.25);
      margin-right: 3px;
    }

    .tab-badge-unavailable svg {
      width: 9px;
      height: 9px;
      stroke: #B45309;
    }

    /* Notice Box */
    .auth-notice-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: right;
      animation: modalPop 0.2s ease;
    }

    .auth-notice-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      margin-top: 2px;
    }

    .auth-notice-text {
      flex: 1;
      font-size: 0.84rem;
      color: #78350F;
      line-height: 1.5;
    }

    .auth-notice-text strong {
      display: block;
      font-weight: 800;
      margin-bottom: 2px;
      color: #92400E;
    }

    .auth-notice-text p {
      margin: 0;
      color: #78350F;
    }

    .auth-notice-close {
      background: none;
      border: none;
      color: #B45309;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .auth-notice-close:hover {
      background: rgba(180, 83, 9, 0.1);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 13px;
      text-align: right;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #2D2522;
    }

    .req-star {
      color: var(--madder);
      margin-right: 2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-prefix {
      position: absolute;
      right: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8E7D70;
      pointer-events: none;
    }

    .input-icon-prefix svg {
      width: 18px;
      height: 18px;
    }

    .settings-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 11px 40px 11px 14px;
      border-radius: 12px;
      border: 1.5px solid #DDD3C4;
      background: #FAF7F2;
      color: #221814;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .settings-input:focus {
      border-color: #6B1530;
      background: #FFFFFF;
      box-shadow: 0 0 0 3.5px rgba(107, 21, 48, 0.12);
    }

    /* Phone input alignment & placeholder */
    .phone-input {
      direction: ltr;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .phone-input::placeholder {
      direction: ltr;
      text-align: right;
      letter-spacing: 1px;
      color: #9C8D80;
      opacity: 0.85;
    }

    .settings-input.pass-input {
      padding-left: 42px;
      padding-right: 40px;
    }

    .toggle-pass-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8E7D70;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
    }

    .toggle-pass-btn:hover {
      color: var(--madder);
      background: rgba(107, 21, 48, 0.05);
    }

    .toggle-pass-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Submit Button */
    .btn-submit {
      font-family: var(--font-display);
      font-weight: 800;
      background: linear-gradient(135deg, #781734 0%, #540F24 100%);
      color: #FFFFFF;
      border: none;
      padding: 13px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.02rem;
      width: 100%;
      box-shadow: 0 4px 16px rgba(107, 21, 48, 0.28);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #881B3C 0%, #60122A 100%);
      box-shadow: 0 6px 20px rgba(107, 21, 48, 0.36);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-submit svg {
      width: 18px;
      height: 18px;
    }

    .auth-status-msg {
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 0.86rem;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-footer-links {
      text-align: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(220, 206, 185, 0.8);
      font-size: 0.92rem;
      color: var(--ink-soft);
    }

    .auth-footer-links a.action-link {
      color: var(--madder);
      font-weight: 800;
      text-decoration: none;
      margin-right: 4px;
      transition: color 0.18s;
    }

    .auth-footer-links a.action-link:hover {
      color: var(--madder-hover);
      text-decoration: underline;
    }

    .web-only-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--ink-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.18s;
    }

    .web-only-back:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    .web-only-back svg {
      width: 14px;
      height: 14px;
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-badge">
        <img src="assets/images/logo.png" alt="MG COPTIC">
      </div>
      <h1>إنشاء حساب جديد</h1>
      <p>انضم لرحلة إتقان اللغة القبطية مجانًا</p>
    </div>

    <!-- تبويبات وسيلة الحساب (موبايل / بريد إلكتروني) -->
    <div class="auth-tabs-pill">
      <button type="button" id="tab-identifier-phone" class="auth-tab-btn active" onclick="switchAuthIdentifierTab('phone')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        <span>برقم الموبايل</span>
      </button>
      <button type="button" id="tab-identifier-email" class="auth-tab-btn" onclick="switchAuthIdentifierTab('email')" title="التسجيل بالبريد الإلكتروني">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span>بالبريد الإلكتروني</span>
      </button>
    </div>

    <form id="auth-form" data-auth-mode="signup" data-auth-type="phone" onsubmit="handleAuthSubmit(event, 'signup')">
      
      <!-- الاسم واسم الأب -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;text-align:right;">
        <div class="form-group" style="margin-bottom:0;">
          <label for="auth-firstname-input">
            <span>الاسم</span>
            <span class="req-star">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon-prefix">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="auth-firstname-input" name="first_name" class="settings-input"
              placeholder="اسمك..." required autofocus>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="auth-fathername-input">
            <span>اسم الأب</span>
            <span class="req-star">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon-prefix">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="auth-fathername-input" name="father_name" class="settings-input"
              placeholder="اسم الأب.." required>
          </div>
        </div>
      </div>
      <input type="hidden" id="auth-name-input" name="full_name" value="">

      <!-- العمر -->
      <div class="form-group">
        <label for="auth-age-input">
          <span>العمر (بالسنوات)</span>
          <span class="req-star">*</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <input type="number" id="auth-age-input" name="age" class="settings-input" placeholder="مثال: 16" min="4" max="110" required>
        </div>
      </div>

      <!-- حقل البريد الإلكتروني -->
      <div class="form-group" id="group-email-input" style="display:none;">
        <label for="auth-email-input">
          <span>البريد الإلكتروني</span>
          <span class="req-star">*</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="auth-email-input" name="email" class="settings-input" placeholder="name@example.com"
            dir="ltr" autocomplete="email">
        </div>
      </div>

      <!-- حقل رقم الموبايل (مطلوب في كافة الحالات) -->
      <div class="form-group" id="group-phone-input">
        <label for="auth-phone-input" id="label-phone-input">
          <span>رقم الموبايل</span>
          <span class="req-star">*</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
              <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
          </span>
          <input type="tel" id="auth-phone-input" name="phone" class="settings-input phone-input" placeholder="012********"
            dir="ltr" inputmode="numeric" autocomplete="tel" required>
        </div>
      </div>

      <!-- كلمة المرور -->
      <div class="form-group">
        <label for="auth-password-input">
          <span>كلمة المرور</span>
          <span style="font-size:0.75rem;color:var(--ink-muted);font-weight:600;">(٨ أحرف على الأقل)</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="auth-password-input" name="password" class="settings-input pass-input"
            placeholder="••••••••" required minlength="8" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('auth-password-input', this)"
            title="إظهار كلمة المرور" aria-label="إظهار كلمة المرور">
            <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- تأكيد كلمة المرور -->
      <div class="form-group">
        <label for="auth-confirm-password-input">
          <span>تأكيد كلمة المرور</span>
          <span class="req-star">*</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="auth-confirm-password-input" name="confirm_password" class="settings-input pass-input"
            placeholder="أعد كتابة كلمة المرور..." required minlength="8" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('auth-confirm-password-input', this)"
            title="إظهار كلمة المرور" aria-label="إظهار كلمة المرور">
            <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div id="auth-status-msg" class="auth-status-msg"></div>

      <button type="submit" id="auth-submit-btn" class="btn-submit">
        <span>إنشاء الحساب والبدء مجاناً</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </form>

    <!-- الفاصل ثم زر التسجيل عبر Google في النهاية -->
    <div class="auth-divider">
      <span>أو المتابعة عبر</span>
    </div>

    <button type="button" class="btn-google" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>التسجيل السريع عبر Google</span>
    </button>

    <div class="auth-footer-links">
      <span>لديك حساب بالفعل؟</span>
      <a id="login-link" href="login.html" class="action-link">سجّل دخولك</a>

      <div>
        <a href="index.html?guest=true" class="web-only-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>العودة للصفحة الرئيسية</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    window.currentAuthTabType = 'phone';

    function switchAuthIdentifierTab(type) {
      window.currentAuthTabType = type;
      const form = document.getElementById('auth-form');
      if (form) form.setAttribute('data-auth-type', type);

      const tabPhone = document.getElementById('tab-identifier-phone');
      const tabEmail = document.getElementById('tab-identifier-email');
      const groupPhone = document.getElementById('group-phone-input');
      const groupEmail = document.getElementById('group-email-input');
      const phoneInput = document.getElementById('auth-phone-input');
      const emailInput = document.getElementById('auth-email-input');

      if (type === 'email') {
        if (tabEmail) tabEmail.classList.add('active');
        if (tabPhone) tabPhone.classList.remove('active');
        if (groupEmail) groupEmail.style.display = 'block';
        if (groupPhone) groupPhone.style.display = 'block';
        if (emailInput) {
          emailInput.required = true;
          emailInput.focus();
        }
        if (phoneInput) phoneInput.required = true;
      } else {
        if (tabPhone) tabPhone.classList.add('active');
        if (tabEmail) tabEmail.classList.remove('active');
        if (groupPhone) groupPhone.style.display = 'block';
        if (groupEmail) groupEmail.style.display = 'none';
        if (phoneInput) {
          phoneInput.required = true;
          phoneInput.focus();
        }
        if (emailInput) emailInput.required = false;
      }
    }
    window.switchAuthIdentifierTab = switchAuthIdentifierTab;

    function togglePassVisibility(inputId, btn) {
      const inp = typeof inputId === 'string' ? document.getElementById(inputId) : inputId;
      if (!inp) return;
      const isPass = inp.type === 'password';
      inp.type = isPass ? 'text' : 'password';

      const targetBtn = btn || (inp.parentElement ? inp.parentElement.querySelector('.toggle-pass-btn') : null);
      if (targetBtn) {
        const eyeOpen = targetBtn.querySelector('.eye-open-icon');
        const eyeClosed = targetBtn.querySelector('.eye-closed-icon');
        if (eyeOpen && eyeClosed) {
          eyeOpen.style.display = isPass ? 'none' : 'block';
          eyeClosed.style.display = isPass ? 'block' : 'none';
        }
        targetBtn.title = isPass ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور';
        targetBtn.setAttribute('aria-label', targetBtn.title);
        targetBtn.style.color = isPass ? 'var(--madder, #6B1530)' : 'var(--ink-muted, #8E7D70)';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        sessionStorage.removeItem('mg_coptic_guest_mode');
        localStorage.removeItem('mg_coptic_guest_mode');
      } catch (_) {}

      // التحقق من وجود جلسة سحابية مسبقة
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');
        if (window.sb && window.sb.auth && !urlParams.has('force')) {
          const { data: { session } } = await sb.auth.getSession();
          if (session && session.user) {
            const target = (redirectUrl && !redirectUrl.includes('login') && !redirectUrl.includes('signup'))
              ? redirectUrl
              : 'index.html';
            try {
              window.location.replace(target);
            } catch (_) {
              window.location.href = target;
            }
            return;
          }
        }
      } catch (err) {
        console.warn('Session check warning:', err);
      }

      // إخفاء العودة للرئيسية في التطبيق الأصلي
      const isNative = typeof window.Capacitor !== 'undefined' &&
                       typeof window.Capacitor.isNativePlatform === 'function' &&
                       window.Capacitor.isNativePlatform();
      if (isNative) {
        document.querySelectorAll('.web-only-back').forEach(el => el.style.display = 'none');
      }

      // الحفاظ على معامل التوجيه لصفحة تسجيل الدخول
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        const loginLink = document.getElementById('login-link');
        if (loginLink) loginLink.href = 'login.html?redirect=' + encodeURIComponent(redirect);
      }
    });
  </script>
  <script src="js/pwa-register.js" defer></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد – MG COPTIC</title>
  <meta name="description" content="إنشاء حساب جديد في منصة MG COPTIC لتعلم اللغة القبطية الكنسية.">
  <meta name="theme-color" content="#6B1530">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MG COPTIC">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&family=Noto+Sans+Coptic&display=swap"
    rel="stylesheet">

  <!-- Core Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="swal-theme.js"></script>

  <!-- Configuration & Auth Service -->
  <script src="js/config/supabase.js"></script>
  <script src="js/services/auth-service.js"></script>

  <style>
    @font-face {
      font-family: 'girges';
      src: url('girges.woff') format('woff'),
        url('assets/fonts/girges.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Coptic Girges';
      src: url('girges.woff') format('woff'),
        url('assets/fonts/girges.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --parchment: #F3E9D2;
      --parchment-soft: #FAF3E4;
      --border-light: #E7DCC8;
      --madder: #6B1530;
      --madder-dark: #4A0E21;
      --gold: #B8892E;
      --gold-pale: #FAF3E4;
      --ink: #2E2018;
      --ink-soft: #5A4A3E;
      --radius-sm: 8px;
      --radius: 16px;
      --font-display: 'Cairo', 'Tajawal', sans-serif;
      --font-body: 'Tajawal', 'Cairo', sans-serif;
      --font-coptic: 'girges', 'Coptic Girges', 'Noto Sans Coptic', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -12%, rgba(168, 130, 58, .14), transparent 60%),
        radial-gradient(1000px 520px at 100% 0%, rgba(140, 36, 48, .08), transparent 55%),
        var(--parchment);
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      background: #FFFDF8;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 32px 26px;
      box-shadow: 0 16px 40px rgba(36, 27, 18, 0.16);
      position: relative;
      animation: modalPop .3s ease-out;
    }

    @keyframes modalPop {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .auth-logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(36, 27, 18, 0.08);
      overflow: hidden;
      padding: 6px;
      box-sizing: border-box;
    }

    .auth-logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .auth-header h1 {
      margin: 4px 0 3px 0;
      font-family: var(--font-display);
      color: var(--ink);
      font-size: 1.45rem;
      font-weight: 800;
    }

    .auth-header p {
      margin: 0;
      font-size: .9rem;
      color: var(--ink-soft);
    }

    .form-group {
      margin-bottom: 13px;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: .86rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--ink);
    }

    .input-wrapper {
      position: relative;
    }

    .settings-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: .95rem;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(168, 130, 58, 0.35);
      background: var(--parchment-soft);
      color: var(--ink);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .settings-input:focus {
      border-color: var(--madder);
      box-shadow: 0 0 0 3px rgba(107, 21, 48, 0.12);
    }

    .toggle-pass-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      padding: 4px;
      font-size: .9rem;
      display: flex;
      align-items: center;
    }

    .btn {
      font-family: var(--font-display);
      font-weight: 700;
      background: var(--madder);
      color: var(--parchment-soft);
      border: none;
      padding: 12px 22px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background .2s, transform .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn:hover {
      background: var(--madder-dark);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .auth-status-msg {
      margin-top: 4px;
      margin-bottom: 12px;
      font-size: .86rem;
      text-align: center;
      min-height: 20px;
      font-weight: 600;
    }

    .auth-footer-links {
      text-align: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border-light);
      font-size: .9rem;
      color: var(--ink-soft);
    }

    .auth-footer-links a {
      color: var(--madder);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-footer-links a:hover {
      text-decoration: underline;
    }

    .web-only-back {
      display: block;
      margin-top: 14px;
      font-size: .84rem;
      color: var(--ink-soft);
      text-decoration: none;
    }

    .web-only-back:hover {
      color: var(--ink);
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-badge">
        <img src="assets/images/logo.png" alt="MG COPTIC">
      </div>
      <h1>إنشاء حساب جديد</h1>
      <p>انضم لرحلة إتقان اللغة القبطية مجانًا</p>
    </div>

    <form id="auth-form" data-auth-mode="signup" onsubmit="handleAuthSubmit(event, 'signup')">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;text-align:right;">
        <div class="form-group" style="margin-bottom:0;">
          <label for="auth-firstname-input">الاسم <span style="color:var(--madder);">*</span></label>
          <input type="text" id="auth-firstname-input" name="first_name" class="settings-input"
            placeholder="اسمك..." required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="auth-fathername-input">اسم الأب <span style="color:var(--madder);">*</span></label>
          <input type="text" id="auth-fathername-input" name="father_name" class="settings-input"
            placeholder="اسم الاب.." required>
        </div>
      </div>
      <input type="hidden" id="auth-name-input" name="full_name" value="">

      <div class="form-group">
        <label for="auth-age-input">العمر (بالسنوات) <span style="color:var(--madder);">*</span></label>
        <input type="number" id="auth-age-input" name="age" class="settings-input" placeholder="مثال: 15" min="4" max="110" required>
      </div>

      <div class="form-group">
        <label for="auth-email-input">البريد الإلكتروني</label>
        <input type="email" id="auth-email-input" name="email" class="settings-input" placeholder="name@example.com"
          required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="auth-password-input">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="auth-password-input" name="password" class="settings-input"
            placeholder="٨ أحرف على الأقل" required minlength="8" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('auth-password-input')"
            title="إظهار/إخفاء كلمة المرور">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="auth-confirm-password-input">تأكيد كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="auth-confirm-password-input" name="confirm_password" class="settings-input"
            placeholder="أعد كتابة كلمة المرور..." required minlength="8" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('auth-confirm-password-input')"
            title="إظهار/إخفاء كلمة المرور">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div id="auth-status-msg" class="auth-status-msg"></div>

      <button type="submit" id="auth-submit-btn" class="btn">
        <span>إنشاء الحساب</span>
      </button>
    </form>

    <div class="auth-footer-links">
      عندك حساب بالفعل؟
      <a id="login-link" href="/login">سجل دخول</a>

      <a href="/" class="web-only-back">← العودة للصفحة الرئيسية</a>
    </div>
  </div>

  <script>
    function togglePassVisibility(inputId) {
      const inp = document.getElementById(inputId);
      if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already logged in -> redirect directly
      try {
        if (window.sb && window.sb.auth) {
          const { data: { session } } = await sb.auth.getSession();
          if (session && session.user) {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect');
            if (redirectUrl && !redirectUrl.includes('login') && !redirectUrl.includes('signup')) {
              window.location.href = redirectUrl;
            } else {
              window.location.href = '/';
            }
            return;
          }
        }
      } catch (err) {
        console.warn('Session check warning:', err);
      }

      // If Capacitor native platform, hide the "Return to homepage" link
      const isNative = typeof window.Capacitor !== 'undefined' &&
                       typeof window.Capacitor.isNativePlatform === 'function' &&
                       window.Capacitor.isNativePlatform();
      if (isNative) {
        document.querySelectorAll('.web-only-back').forEach(el => el.style.display = 'none');
      }

      // Preserve redirect parameter on the login link
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        const loginLink = document.getElementById('login-link');
        if (loginLink) loginLink.href = '/login?redirect=' + encodeURIComponent(redirect);
      }
    });
  </script>
  <script src="js/pwa-register.js" defer></script>
</body>

</html>
